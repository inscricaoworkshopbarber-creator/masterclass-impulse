function renderIntro(){
  nav.hidden=true;
  const has=Object.keys(data).length>0;
  app.innerHTML=`
  <p class="step-count">Diagnóstico Prosperar Ideias</p>
  <h1>Raio-X do seu negócio de beleza</h1>
  <p class="lead">Barbearia, salão, studio ou estética: responda com calma e com as suas palavras. É a partir daqui que vamos criar seus carrosséis, anúncios, roteiros de vídeo e site com a cara da sua casa.</p>
  <p class="lead">São 8 etapas e leva de 20 a 30 minutos. Suas respostas ficam salvas neste aparelho enquanto você preenche.</p>
  <div class="actions"><button class="btn pri" id="go" type="button">${has?"Continuar de onde parei":"Começar o raio-x"}</button>
  ${has?'<button class="btn sec" id="reset" type="button">Começar do zero</button>':""}</div>
  <p class="sign">Silvana Rosa · Estrategista de Negócios e Growth</p>`;
  document.getElementById("go").onclick=()=>go(0);
  const r=document.getElementById("reset");
  if(r) r.onclick=()=>{if(confirm("Apagar as respostas salvas e começar de novo?")){data={};try{localStorage.removeItem(KEY)}catch(e){}renderIntro();}};
}

function fieldHTML(f){
  if(f.t==="note") return `<div class="field" data-k="${f.k}"><div class="note" role="note"><strong>${esc(f.l)}</strong><p>${esc(f.h)}</p><a href="${f.link}" target="_blank" rel="noopener">Abrir registro.br</a></div><div class="err"></div></div>`;
  const v=data[f.k], req=f.req?" *":"";
  let h=`<div class="field" data-k="${f.k}"><${["radio","multi","list","colors"].includes(f.t)?'div class="lbl"':'label for="f_'+f.k+'"'}>${esc(f.l)}${req}</${["radio","multi","list","colors"].includes(f.t)?"div":"label"}>`;
  if(f.h) h+=`<p class="hint">${esc(f.h)}</p>`;
  if(["text","tel","url"].includes(f.t)) h+=`<input id="f_${f.k}" type="${f.t}" value="${esc(v)}" autocomplete="off">`;
  else if(f.t==="textarea") h+=`<textarea id="f_${f.k}">${esc(v)}</textarea>`;
  else if(f.t==="radio"||f.t==="multi"){
    const arr=f.t==="multi"?(v||[]):[v];
    h+=`<div class="chips" role="group">`+f.o.map(o=>`<button type="button" class="chip" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o)}</button>`).join("")+`</div>`;
    if(f.t==="multi") h+=`<input type="text" class="outro" placeholder="Outro (opcional)" value="${esc(data[f.k+"_outro"])}" style="margin-top:10px">`;
  }
  else if(f.t==="colors"){
    const c=v||["#000000","#ffffff","#888888"];
    h+=`<div class="colors">`+["Principal","Secundária","Destaque"].map((n,i)=>`<div class="color"><small>${n}</small><input type="color" data-i="${i}" value="${esc(c[i])}" aria-label="Cor ${n}"><input type="text" data-hex="${i}" value="${esc(c[i])}" aria-label="Código da cor ${n}"></div>`).join("")+`</div>`;
  }
  else if(f.t==="list"){
    const items=(v&&v.length)?v:[{}];
    h+=`<div class="items">`+items.map((it,i)=>itemHTML(f,it,i)).join("")+`</div><button type="button" class="add">+ ${esc(f.add)}</button>`;
  }
  return h+`<div class="err" aria-live="polite"></div></div>`;
}
function itemHTML(f,it,i){
  const ins=f.sub.map(s=>`<input type="text" data-s="${s.k}" placeholder="${esc(s.p)}" value="${esc(it[s.k])}">`);
  const body=f.sub.length===3?`${ins[0]}<div class="row">${ins[1]}${ins[2]}</div>`:`${ins[0]}${ins[1]}${ins[2]}${ins[3]||""}`;
  return `<div class="item">${body}<button type="button" class="del">Remover</button></div>`;
}

function collect(){
  STEPS[step].fields.forEach(f=>{
    const box=app.querySelector(`[data-k="${f.k}"]`);
    if(f.t==="note") return;
    if(box.hidden){delete data[f.k];return;}
    if(["text","tel","url","textarea"].includes(f.t)) data[f.k]=box.querySelector("input,textarea").value.trim();
    else if(f.t==="radio"){const p=box.querySelector('.chip[aria-pressed="true"]');data[f.k]=p?p.dataset.v:"";}
    else if(f.t==="multi"){data[f.k]=[...box.querySelectorAll('.chip[aria-pressed="true"]')].map(b=>b.dataset.v);data[f.k+"_outro"]=box.querySelector(".outro").value.trim();}
    else if(f.t==="colors") data[f.k]=[0,1,2].map(i=>box.querySelector(`[data-hex="${i}"]`).value.trim());
    else if(f.t==="list") data[f.k]=[...box.querySelectorAll(".item")].map(it=>{const o={};it.querySelectorAll("input").forEach(x=>o[x.dataset.s]=x.value.trim());return o;}).filter(o=>Object.values(o).some(Boolean));
  });
  save();
}
function validate(){
  let ok=true,first=null;
  STEPS[step].fields.forEach(f=>{
    const box=app.querySelector(`[data-k="${f.k}"]`),err=box.querySelector(".err");err.textContent="";
    if(!f.req||box.hidden) return;
    const v=data[f.k];const empty=!v||(Array.isArray(v)&&!v.length);
    if(empty){ok=false;err.textContent="Preencha este campo para continuar.";first=first||box;}
  });
  if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
  return ok;
}

function renderStep(){
  const s=STEPS[step];nav.hidden=false;document.getElementById("saved").textContent="";
  app.innerHTML=`<div class="bar"><p class="step-count">Etapa ${step+1} de ${STEPS.length}</p><div class="track"><div class="fill" style="width:${(step+1)/STEPS.length*100}%"></div></div></div>
  <h2>${esc(s.title)}</h2><p class="intro-step">${esc(s.intro)}</p>`+s.fields.map(fieldHTML).join("");
  next.textContent=step===STEPS.length-1?"Gerar meu raio-x":"Continuar";
  bind();window.scrollTo(0,0);
}
function current(k){const box=app.querySelector(`[data-k="${k}"]`);if(!box)return data[k];const p=box.querySelector('.chip[aria-pressed="true"]');return p?p.dataset.v:"";}
function visibility(){
  STEPS[step].fields.forEach(f=>{if(!f.show)return;const box=app.querySelector(`[data-k="${f.k}"]`);
    const parent=app.querySelector(`[data-k="${f.show.k}"]`);
    box.hidden=!(parent&&!parent.hidden&&f.show.v.includes(current(f.show.k)));});
  STEPS[step].fields.forEach(f=>{if(!f.show)return;const box=app.querySelector(`[data-k="${f.k}"]`);const parent=app.querySelector(`[data-k="${f.show.k}"]`);if(parent&&parent.hidden)box.hidden=true;});
}
function bind(){
  visibility();
  app.querySelectorAll(".field").forEach(box=>{
    const f=STEPS[step].fields.find(x=>x.k===box.dataset.k);
    box.addEventListener("input",()=>{box.querySelector(".err").textContent="";});
    if(f.t==="radio"||f.t==="multi") box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      if(f.t==="radio") box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed",f.t==="radio"?"true":String(b.getAttribute("aria-pressed")!=="true"));
      box.querySelector(".err").textContent="";
      visibility();
    });
    if(f.t==="colors"){
      box.querySelectorAll('input[type=color]').forEach(c=>c.oninput=()=>{box.querySelector(`[data-hex="${c.dataset.i}"]`).value=c.value;});
      box.querySelectorAll('[data-hex]').forEach(t=>t.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(t.value))box.querySelector(`[data-i="${t.dataset.hex}"]`).value=t.value;});
    }
    if(f.t==="list"){
      const wrap=box.querySelector(".items");
      box.querySelector(".add").onclick=()=>{wrap.insertAdjacentHTML("beforeend",itemHTML(f,{},0));wireDel();wrap.lastElementChild.querySelector("input").focus();};
      const wireDel=()=>wrap.querySelectorAll(".del").forEach(d=>d.onclick=()=>{if(wrap.children.length>1)d.parentElement.remove();else d.parentElement.querySelectorAll("input").forEach(i=>i.value="");});
      wireDel();
    }
  });
}
function go(i){step=i;if(step<0)renderIntro();else if(step>=STEPS.length)renderFinal();else renderStep();}
prev.onclick=()=>{collect();go(step-1);};
next.onclick=()=>{collect();if(!validate())return;go(step+1);};

const j=a=>Array.isArray(a)?a.filter(Boolean).join(", "):(a||"");
const multi=k=>[j(data[k]),data[k+"_outro"]].filter(Boolean).join(", ");
const val=x=>x&&String(x).trim()?x:"(não informado)";

function diagnostico(d){
  const a=[],has=(k,v)=>(d[k]||[]).includes(v);
  const semGMN=["Não tenho","Não sei"].includes(d.gmn), semSite=d.site==="Não";
  if(semGMN) a.push("CRÍTICO: sem Google Meu Negócio confirmado. Criar ou recuperar o perfil (categoria, endereço, horário, fotos, serviços, link).");
  else{
    if(d.gmnacesso&&d.gmnacesso!=="Sim") a.push("Recuperar o acesso ao Google Meu Negócio: o dono precisa ser proprietário do perfil.");
    if(["Quase nunca","Nunca postamos lá","Não sei"].includes(d.gmnpost)) a.push("Google Meu Negócio parado: criar rotina de postagem semanal e atualizar fotos.");
    if(!has("gmncuida","Respondemos as avaliações")) a.push("Responder todas as avaliações do Google, inclusive as antigas.");
  }
  if(semSite&&d.dominiocomprado!=="Sim, já comprei") a.push("URGENTE: domínio ainda não comprado. Comprar no registro.br antes da aula"+(d.dominio?" ("+d.dominio+")":"")+".");
  if(semSite) a.push("CRÍTICO: sem site próprio. Gerar o site com a skill de site, publicar com domínio, criar sitemap.xml e enviar ao Google Search Console e ao Bing Webmaster Tools.");
  else if(d.indexado!=="Sim") a.push("Site existe mas não foi confirmado no Google e no Bing: gerar sitemap.xml e enviar aos dois.");
  if(semGMN&&semSite) a.push("Hoje as IAs praticamente não conseguem indicar este negócio. Até o site e o GMN ficarem prontos, o Instagram precisa estar 100% configurado.");
  const insta=["Conta profissional","Categoria (ex: barbearia)","Endereço na bio","Link de agenda ou WhatsApp","Botão de reservar / contato"].filter(x=>!has("insta",x));
  if(insta.length) a.push("Instagram: falta configurar "+insta.join(", ")+".");
  if(["Agência / social media","Ninguém"].includes(d.quemposta)) a.push("Redes delegadas ou sem dono: definir quem posta e com que frequência.");
  return a.length?a.map((x,i)=>`${i+1}. ${x}`).join("\n"):"Presença de busca em dia. Foco em conteúdo e campanhas.";
}
function slug(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function sitemap(d){
  const map={"Serviços e preços":"servicos","Equipe":"equipe","Galeria e antes/depois":"galeria","Nossa história":"sobre","Depoimentos":"depoimentos","Localização e mapa":"contato","Clube de assinatura":"clube","Loja de produtos":"loja","Perguntas frequentes":"perguntas-frequentes","Dicas / blog":"blog","Vale-presente":"vale-presente","Agendamento online":"agendar"};
  const pg=["/ (início)"];(d.paginas||[]).forEach(x=>{if(map[x])pg.push("/"+map[x]);});
  if(d.paginas_outro) pg.push("/"+slug(d.paginas_outro));
  return pg.join("\n");
}
function cartao(){
  const d=data,c=d.cores||[];
  const serv=(d.lista||[]).map(s=>`- ${s.s||"?"}: R$ ${s.p||"?"} · ${s.m||"?"} min`).join("\n")||"(não informado)";
  const eq=(d.equipe||[]).map(e=>`- ${e.n||"?"}: ${e.e||""}${e.j?" · jeito: "+e.j:""}${e.v?" · grava vídeo: "+e.v:""}`).join("\n")||"(não informado)";
  return `# CARTÃO DE MARCA · ${val(d.nome)}
Raio-X Prosperar Ideias · gerado em ${new Date().toLocaleDateString("pt-BR")}

## INSTRUÇÕES PARA A SKILL
Use SOMENTE estas cores: ${c.filter(Boolean).join(" / ")||"(não informado)"} (principal / secundária / destaque).
Fontes: ${val(d.fontes)}. Estilo visual: ${val(multi("estilo"))}. Tom de voz: ${val(multi("tom"))}.
Nunca usar: ${val(d.naoquer)}
Toda peça deve citar bairro/cidade (${val(d.cidade)}) e terminar com CTA para o WhatsApp ${val(d.whatsapp)}.

## DIAGNÓSTICO DE PRESENÇA (prioridades)
${diagnostico(d)}

## INSTRUÇÕES PARA A SKILL DE SITE
Domínio: ${val(d.sitelink||d.dominio)}${d.dominiocomprado?" · "+d.dominiocomprado:""}
Mapa do site (sitemap):
${sitemap(d)}
Todas as páginas com botão de WhatsApp ${val(d.whatsapp)}${d.agenda?" e link de agenda ("+d.agenda+")":""}.
Palavras-chave locais (usar em títulos, descrições e textos): ${val(d.categoria)}
Bairros para citar: ${val(d.cidade)}${d.bairros?", "+d.bairros:""}
Dados para Schema LocalBusiness: ${val(d.nome)} · ${val(d.endereco)} · ${val(d.horario)} · ${val(d.whatsapp)}
Depois de publicar: gerar sitemap.xml e robots.txt, enviar ao Google Search Console e ao Bing Webmaster Tools, e colocar o link do site no Google Meu Negócio e na bio do Instagram.

## GOOGLE MEU NEGÓCIO
Situação: ${val(d.gmn)} · Acesso: ${val(d.gmnacesso)} · Postagem: ${val(d.gmnpost)}
Já em dia: ${val(multi("gmncuida"))}
Texto que o dono quer no perfil: ${val(d.gmntexto)}

## INSTAGRAM
Perfil: ${val(d.instagram)} · Quem cuida: ${val(d.quemposta)}
Já configurado: ${val(multi("insta"))}

## IDENTIDADE
Tipo de casa: ${val(d.tipo)}
Responsável: ${val(d.responsavel)}
Endereço: ${val(d.endereco)} · Referência: ${val(d.referencia)}
Horário: ${val(d.horario)} · Tempo de casa: ${val(d.tempo)} · Estrutura: ${val(d.cadeiras)}
3 palavras da marca: ${val(d.palavras)}

## HISTÓRIA (base para carrosséis de autoridade)
Começo: ${val(d.comeco)}
Viradas: ${val(d.viradas)}
Momento difícil: ${val(d.dificil)}
Por que nos escolhem: ${val(d.porque)}
Frase na parede: ${val(d.frase)}
Não negociáveis: ${val(d.naonegociaveis)}

## SERVIÇOS E OFERTAS
${serv}
Carro-chefe: ${val(d.carrochefe)} · Mais lucrativo: ${val(d.lucro)}
Combos: ${val(d.combos)}
Especiais: ${val(multi("especiais"))}
Clube de assinatura: ${val(d.clube)} ${d.clubedetalhe?"· "+d.clubedetalhe:""}
Produtos: ${val(d.produtos)}

## EXPERIÊNCIA E EQUIPE (personagens para reels)
Ritual de atendimento: ${val(d.ritual)}
No espaço: ${val(multi("espaco"))}
${eq}

## PÚBLICO
Atende: ${val(multi("atende"))}
Cliente favorito: ${val(d.ideal)}
Ticket médio: ${val(d.ticket)} · Retorno: ${val(d.retorno)}
Elogios reais: ${val(d.elogios)}
Objeções: ${val(d.objecoes)}
Perguntas no WhatsApp (FAQ do site e do atendente IA): ${val(d.perguntas)}
Concorrência e diferencial: ${val(d.concorrentes)}

## PRESENÇA DIGITAL
Frequência de postagem: ${val(d.frequencia)}
Formatos já feitos: ${val(multi("formatos"))}
O que funcionou: ${val(d.funcionou)}
Avaliações no Google: ${val(d.google)}
Anúncios: ${val(d.trafego)} · Verba mensal: ${val(d.verba)}
Logo: ${val(d.logo)} · Pasta de fotos: ${val(d.pasta)}
Referências admiradas: ${val(d.referencias)}

## METAS E CAMPANHAS
Horários vazios (prioridade de campanha): ${val(d.vazios)}
Meta 90 dias: ${val(d.meta)}
Datas da casa: ${val(multi("datas"))}
Uso de imagem: ${val(d.imagem)}
`;
}

function renderFinal(){
  nav.hidden=true;const txt=cartao();
  app.innerHTML=`<div class="print-header">
    <h1>Raio-X do Negócio · Masterclass Agenda Cheia com IA</h1>
    <p>Silvana Rosa × Barone · Diagnóstico de Presença, Posicionamento e Ativos Digitais</p>
  </div>
  <h2>Seu raio-x está pronto</h2>
  <p class="lead">Envie para a Silvana pelo WhatsApp ou salve em PDF para guardar e consultar quando quiser.</p>
  <div class="card" id="card">${esc(txt)}</div>
  <div class="actions">
   <button class="btn pri" id="wa" type="button">Enviar pelo WhatsApp</button>
   <button class="btn sec" id="pdf" type="button">Salvar em PDF</button>
   <button class="btn sec" id="dl" type="button">Baixar em Markdown (.md)</button>
   <button class="btn sec" id="cp" type="button">Copiar texto</button>
   <button class="btn sec" id="ed" type="button">Revisar respostas</button>
  </div><p class="toast" id="toast" aria-live="polite"></p>
  <p class="hint">Fotos e logo: mande o link da pasta no campo da etapa 6 ou envie direto no WhatsApp.</p>`;
  const toast=m=>document.getElementById("toast").textContent=m;
  document.getElementById("wa").onclick=()=>{
    let t=txt;if(t.length>6000){t=t.slice(0,6000)+"\n\n(continua no arquivo que vou enviar em seguida)";toast("O texto é longo: baixe o arquivo e envie junto no WhatsApp.");}
    window.open(`https://wa.me/${WHATS}?text=${encodeURIComponent(t)}`,"_blank");
  };
  document.getElementById("pdf").onclick=()=>{
    const origTitle=document.title;
    const cleanName=(data.nome||"negocio").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
    document.title=`raio-x-${cleanName}-agenda-cheia`;
    toast("Abrindo janela para salvar em PDF...");
    setTimeout(()=>{
      window.print();
      setTimeout(()=>{document.title=origTitle;},1000);
    },150);
  };
  document.getElementById("dl").onclick=async()=>{
    const name=(data.nome||"negocio").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
    if(!window.claude){const b=new Blob([txt],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`raio-x-${name}.md`;document.body.appendChild(a);a.click();a.remove();toast("Arquivo baixado.");return;}
    if(!dlApi){toast("Baixar não está disponível aqui. Use “Copiar texto”.");return;}
    try{await dlApi.save({filename:`raio-x-${name}.md`,data:new Blob([txt],{type:"text/markdown;charset=utf-8"})});toast("Arquivo baixado.");}
    catch(e){toast(e&&e.code==="declined"?"Download cancelado.":"Não foi possível baixar agora. Use “Copiar texto”.");}
  };
  if(window.claude&&!dlApi) document.getElementById("dl").hidden=true;
  document.getElementById("cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Texto copiado.");}catch(e){toast("Não deu para copiar automaticamente. Selecione o texto no quadro e copie.");}};
  document.getElementById("ed").onclick=()=>go(0);
  window.scrollTo(0,0);
}
renderIntro();
</script>
